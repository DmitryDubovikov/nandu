<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_TXT}}</title>
<style>
 :root{--bg:#0d1117;--ink:#e8eef6;--muted:#93a1b1;--dim:#5d6b7c;--blue:#5ba8f5;--gold:#f0a83c;--line:#243040;
   --sans:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);padding:50px 26px 90px;
   font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
 .col{max-width:760px;margin:0 auto}
 h1{font-size:clamp(26px,3.4vw,36px);margin:0 0 6px}
 .sub{font-family:var(--sans);font-size:14.5px;color:var(--dim);margin:0 0 40px}
 .navpart{font-family:var(--sans);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
   color:var(--gold);margin:34px 0 12px}
 a.ix{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;
   padding:16px 20px;margin:0 0 10px;background:#111823;transition:border-color .2s}
 a.ix:hover{border-color:var(--blue)}
 a.ix b{display:block;font-size:18.5px;color:var(--ink);font-weight:600;margin-bottom:5px}
 a.ix span{font-family:var(--sans);font-size:14px;color:var(--muted);line-height:1.5}
.pre{margin:0 0 34px}
 .pre p,.pre .note p{font-size:16px;line-height:1.6;color:var(--muted);margin:12px 0 0}
 .pre .note{border-left:2px solid var(--line);padding-left:18px}
 .pre b{color:var(--ink)} .pre code{font-size:13.5px;color:var(--blue)}
 @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="col">
<h1>{{TITLE}}</h1><p class="sub">{{SUB}}</p>
<div class="pre">{{PRE}}</div>
{{ROWS}}
</div></body></html>
